services:
  - type: web
    name: proptenant-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: Resend_api_key
        sync: false
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: Property Manager
